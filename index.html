<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pase VIP - Noche Mexicana</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --verde: #006847;
            --blanco: #ffffff;
            --rojo: #ce1126;
            --dorado: #ffd700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #08080a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
            padding: 20px;
        }

        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0,104,71,0.35) 0%, rgba(206,17,38,0.35) 50%, rgba(0,0,0,0) 70%);
            filter: blur(50px);
            animation: pulse 3s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.2); opacity: 0.9; }
        }

        /* Tarjeta Responsiva */
        .ticket-container {
            position: relative;
            width: 100%;
            max-width: 340px;
            background: #111116;
            border-radius: 24px;
            padding: 3px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 25px rgba(255, 215, 0, 0.15);
            transition: transform 0.15s cubic-bezier(0.2, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .ticket-container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--verde), var(--blanco), var(--rojo), var(--dorado));
            border-radius: 26px;
            z-index: -1;
            opacity: 0.8;
        }

        .ticket-body {
            background: #121218;
            border-radius: 22px;
            padding: 24px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .badge-vip {
            display: inline-block;
            background: linear-gradient(90deg, var(--dorado), #fff8b3, var(--dorado));
            color: #000;
            font-weight: 900;
            font-size: 0.8rem;
            padding: 5px 14px;
            border-radius: 50px;
            letter-spacing: 2px;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
            margin-bottom: 12px;
        }

        .title {
            color: var(--blanco);
            font-size: 1.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .subtitle {
            background: linear-gradient(90deg, var(--verde), #ffffff, var(--rojo));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .date-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 16px;
        }

        .date-box .date {
            color: var(--dorado);
            font-size: 1.25rem;
            font-weight: 800;
        }

        .date-box .location {
            color: #999;
            font-size: 0.8rem;
            margin-top: 2px;
        }

        /* Banner de Seguridad Anti-Duplicado */
        .security-status {
            background: rgba(0, 104, 71, 0.2);
            border: 1px solid var(--verde);
            color: #4efaab;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Estado Duplicado (Alarma) */
        .ticket-container.duplicate {
            animation: shake 0.5s ease-in-out;
        }
        .ticket-container.duplicate::before {
            background: var(--rojo) !important;
            box-shadow: 0 0 30px var(--rojo);
        }
        .ticket-container.duplicate .security-status {
            background: rgba(206, 17, 38, 0.25);
            border: 1px solid var(--rojo);
            color: #ff6b6b;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .token-info {
            font-family: monospace;
            color: #666;
            font-size: 0.7rem;
            margin-top: 10px;
            word-break: break-all;
        }

        .btn-action {
            margin-top: 15px;
            background: linear-gradient(90deg, var(--verde), #00a870);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9rem;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 104, 71, 0.4);
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="ticket-container" id="ticket">
        <div class="ticket-body">
            <div class="badge-vip">PASE VIP VERIFICADO</div>
            <h1 class="title">Gran Noche</h1>
            <div class="subtitle">🇲🇽 ¡VIVA MÉXICO! 🇲🇽</div>
            
            <div class="date-box">
                <div class="date">15 DE SEPTIEMBRE</div>
                <div class="location">Acceso Preferencial • Zona VIP</div>
            </div>

            <!-- Indicador de Autenticidad -->
            <div class="security-status" id="secStatus">
                <span>🛡️ CÓDIGO AUTÉNTICO (1er ESCANEO)</span>
            </div>

            <p style="color:#aaa; font-size:0.8rem;" id="welcomeMsg">¡Bienvenido al evento! Muestra esta pantalla en el acceso.</p>

            <button class="btn-action" id="confettiBtn">🎉 Celebrar acceso</button>

            <div class="token-info" id="tokenDisplay">ID: VIP-PENDING</div>
        </div>
    </div>

    <script>
        const ticket = document.getElementById('ticket');
        const secStatus = document.getElementById('secStatus');
        const welcomeMsg = document.getElementById('welcomeMsg');
        const tokenDisplay = document.getElementById('tokenDisplay');
        const confettiBtn = document.getElementById('confettiBtn');

        // --- 1. DETECCIÓN DE CÓDIGO DUPLICADO / ESCANEO ÚNICO ---
        const urlParams = new URLSearchParams(window.location.search);
        // Si la URL del QR trae un id (ej: mi-sitio.github.io/?id=TICKET-001)
        const ticketId = urlParams.get('id') || 'DEMO-VIP-2026';
        
        tokenDisplay.innerText = `TOKEN ID: ${ticketId}`;

        // Revisa si este ticket ya fue marcado como escaneado en este dispositivo
        const scanHistory = JSON.parse(localStorage.getItem('scanned_tickets') || '{}');

        if (scanHistory[ticketId]) {
            // EL TICKET ES UN DUPLICADO / YA FUE USADO
            ticket.classList.add('duplicate');
            secStatus.innerHTML = `⚠️ ¡ALERTA! CÓDIGO DUPLICADO O YA USADO`;
            welcomeMsg.innerText = `Este pase ya fue validado anteriormente el ${scanHistory[ticketId]}. Si compraste este QR físico, fue clonado.`;
            welcomeMsg.style.color = '#ff6b6b';
            confettiBtn.style.display = 'none';
        } else {
            // PRIMER ESCANEO VÁLIDO: Registra la hora exacta de escaneo
            scanHistory[ticketId] = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            localStorage.setItem('scanned_tickets', JSON.stringify(scanHistory));

            // Disparar confeti al abrir si es válido
            setTimeout(lanzarConfetti, 400);
        }

        // --- 2. INTERACCIÓN GIROSCÓPICAL Y TÁCTIL PARA MÓVILES ---
        // Giroscopio (Orientación del teléfono)
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                if (!e.gamma || !e.beta) return;
                const tiltX = Math.min(Math.max(e.gamma / 2, -20), 20); // Inclinación izq/der
                const tiltY = Math.min(Math.max((e.beta - 45) / 2, -20), 20); // Inclinación frente/atrás
                ticket.style.transform = `rotateY(${tiltX}deg) rotateX(${-tiltY}deg)`;
            });
        }

        // Interacción Táctil (Touch screen)
        ticket.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            const xAxis = (window.innerWidth / 2 - touch.clientX) / 12;
            const yAxis = (window.innerHeight / 2 - touch.clientY) / 12;
            ticket.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        ticket.addEventListener('touchend', () => {
            ticket.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        // --- 3. EFECTO CONFETI ---
        function lanzarConfetti() {
            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#006847', '#ffffff', '#ce1126', '#ffd700']
            });
        }

        confettiBtn.addEventListener('click', lanzarConfetti);
    </script>
</body>
</html>
